<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tycoon Empire</title>
<style>
:root{--bg:#0f1117;--panel:#171b25;--panel2:#222838;--gold:#f4c430;--red:#c0392b;--green:#2ecc71;--text:#f6efd8;--muted:#b9ad8c;--line:#3a4054}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at top,#26314a 0,#0f1117 55%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.app{max-width:1180px;margin:0 auto;padding:18px}.hero{border:3px double var(--gold);background:linear-gradient(180deg,#202638,#111521);box-shadow:0 8px 0 #9e7b16,0 20px 50px #0008;padding:18px;border-radius:18px;display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.title h1{margin:0;color:var(--gold);font-size:clamp(32px,6vw,58px);letter-spacing:2px;text-shadow:3px 3px 0 var(--red);line-height:.95}.title p{margin:8px 0 0;color:var(--muted);font-style:italic}.money{background:#f3ead3;color:#10131b;border:2px solid var(--gold);box-shadow:inset 0 0 0 4px #f3ead3,inset 0 0 0 6px #c79c20;border-radius:14px;min-width:min(100%,300px);padding:14px;text-align:right}.money small{display:block;font-weight:900;letter-spacing:2px;color:#9e7b16}.money strong{display:block;font-size:32px;line-height:1.1}.money span{color:#166b45;font-weight:800}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:20px 0}.stat{background:#ffffff0c;border-left:4px solid var(--gold);border-radius:12px;padding:12px}.stat small{display:block;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;font-size:11px}.stat strong{font-size:22px}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:16px 0}.btn{border:2px solid var(--gold);background:#111521;color:var(--gold);border-radius:12px;padding:10px 13px;font-weight:900;cursor:pointer}.btn:hover:not(:disabled),.btn.active{background:var(--gold);color:#10131b}.btn.red{border-color:var(--red);color:#ff8d82}.btn.red:hover{background:var(--red);color:white}.btn:disabled{opacity:.45;cursor:not-allowed}.businesses{display:flex;flex-direction:column;gap:14px}.biz{display:grid;grid-template-columns:78px 1fr 190px;gap:14px;align-items:center;background:#f3ead3;color:#111521;border:2px solid #111521;border-radius:16px;padding:13px;box-shadow:6px 6px 0 #a77f18}.biz.locked{background:#242b3b;color:#9ca4b8;border-color:#495064;box-shadow:6px 6px 0 #111521}.icon{height:70px;width:70px;display:grid;place-items:center;background:#10131b;color:var(--gold);border:3px solid var(--gold);border-radius:16px;font-size:34px;cursor:pointer;user-select:none}.icon.managed:after{content:'👔';position:absolute}.icon:active{transform:scale(.95)}.info h3{display:flex;justify-content:space-between;gap:8px;align-items:baseline;margin:0 0 9px;font-size:18px}.owned{background:#10131b;color:var(--gold);font-size:12px;border-radius:999px;padding:3px 9px}.bar{height:28px;background:#dccd9e;border:2px solid #10131b;border-radius:999px;overflow:hidden;position:relative}.fill{height:100%;width:0;background:linear-gradient(90deg,#1b9b6a,#54d392)}.bar span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:900;text-shadow:0 0 4px white}.buy{text-align:left}.buy b{display:block;font-size:15px}.buy small{display:block;opacity:.8}.modalBack{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modalBack.show{display:flex}.modal{width:min(760px,100%);max-height:88vh;overflow:auto;background:#10131b;border:3px double var(--gold);border-radius:18px;box-shadow:0 20px 60px #000}.modalHead{display:flex;justify-content:space-between;align-items:center;padding:16px;border-bottom:2px solid var(--gold)}.modalHead h2{margin:0;color:var(--gold)}.list{display:grid;gap:10px;padding:14px}.card{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;background:#f3ead3;color:#10131b;border:2px solid #10131b;border-radius:14px;padding:12px}.card.done{background:#d7f2df}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,120px);opacity:0;background:var(--gold);color:#10131b;border:2px solid #10131b;border-radius:14px;padding:12px 18px;font-weight:900;box-shadow:4px 4px 0 #000;transition:.25s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:680px){.biz{grid-template-columns:62px 1fr}.icon{width:58px;height:58px;font-size:28px}.buy{grid-column:1/-1}.money{text-align:left}}
</style>
</head>
<body>
<div class="app">
  <section class="hero">
    <div class="title"><h1>TYCOON EMPIRE</h1><p>An idle pursuit of indecent wealth.</p></div>
    <div class="money"><small>★ CAPITAL ★</small><strong id="cash">$0</strong><span id="rate">+$0/sec</span></div>
  </section>
  <div class="stats">
    <div class="stat"><small>Total Earned</small><strong id="earned">$0</strong></div>
    <div class="stat"><small>Businesses</small><strong id="bizTotal">0</strong></div>
    <div class="stat"><small>Investors</small><strong id="investors">0</strong></div>
    <div class="stat"><small>Clicks</small><strong id="clicks">0</strong></div>
  </div>
  <div class="controls">
    <button class="btn active" data-mult="1">Buy ×1</button><button class="btn" data-mult="10">×10</button><button class="btn" data-mult="100">×100</button><button class="btn" data-mult="max">MAX</button>
    <button class="btn" id="mgrBtn">👔 Managers</button><button class="btn" id="upgBtn">⚡ Upgrades</button><button class="btn" id="prestigeBtn">💼 Invest</button><button class="btn red" id="resetBtn">Reset</button>
  </div>
  <main class="businesses" id="businesses"></main>
</div>
<div class="modalBack" id="modal"><div class="modal"><div class="modalHead"><h2 id="modalTitle"></h2><button class="btn" id="close">✕</button></div><div class="list" id="modalBody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
const B=[
{id:0,n:'Lemonade Stand',i:'🍋',c:4,r:1,t:1,g:1.07,m:1000,mn:'Wendy The Squeeze'},
{id:1,n:'Newspaper Route',i:'📰',c:60,r:60,t:3,g:1.15,m:15000,mn:'Ricky Headlines'},
{id:2,n:'Pizza Parlor',i:'🍕',c:720,r:540,t:6,g:1.14,m:100000,mn:'Tony Pepperoni'},
{id:3,n:'Donut Shop',i:'🍩',c:8640,r:4320,t:12,g:1.13,m:500000,mn:'Glenda Glaze'},
{id:4,n:'Shrimp Boat',i:'🦐',c:103680,r:51840,t:24,g:1.12,m:1200000,mn:'Captain Bubba'},
{id:5,n:'Hockey Team',i:'🏒',c:1244160,r:622080,t:96,g:1.11,m:50000000,mn:'Coach Slapshot'},
{id:6,n:'Movie Studio',i:'🎬',c:14929920,r:7464960,t:384,g:1.10,m:800000000,mn:'Lana Final Cut'},
{id:7,n:'Bank',i:'🏦',c:179159040,r:89579520,t:1536,g:1.09,m:40000000000,mn:'Mr. Pennypacker'},
{id:8,n:'Oil Company',i:'🛢️',c:2149908480,r:1074954240,t:6144,g:1.08,m:750000000000,mn:'Hank Black Gold'},
{id:9,n:'Space Program',i:'🚀',c:25798901760,r:29668737024,t:36864,g:1.07,m:15000000000000,mn:'Dr. Vex Orbital'}];
const U=[
{id:'u0',name:'Golden Squeezer',d:'Lemonade profit ×3',target:0,type:'profit',mult:3,cost:250000},
{id:'u1',name:'Headline Machine',d:'Newspaper profit ×3',target:1,type:'profit',mult:3,cost:12000000},
{id:'u2',name:'Hyper Oven',d:'Pizza speed ×2',target:2,type:'speed',mult:2,cost:80000000},
{id:'u3',name:'Drone Delivery',d:'Donut speed ×2',target:3,type:'speed',mult:2,cost:700000000},
{id:'u4',name:'Offshore Account',d:'All profit ×1.5',target:-1,type:'global',mult:1.5,cost:50000000},
{id:'u5',name:'Lobbyist on Retainer',d:'All profit ×2',target:-1,type:'global',mult:2,cost:5000000000},
{id:'u6',name:'Asteroid Charter',d:'Space profit ×3',target:9,type:'profit',mult:3,cost:2000000000000000}];
let S=load();let mult=1;let last=performance.now();let saveTimer=0;
function fresh(){return{cash:4,total:0,clicks:0,investors:0,b:B.map((x,i)=>({q:i?0:1,p:0,run:false,man:false})),up:{},last:Date.now()}}
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.tycoonEmpire||'{}'))}catch(e){return fresh()}}
function save(){S.last=Date.now();localStorage.tycoonEmpire=JSON.stringify(S)}
function fmt(n){if(!isFinite(n))return '$∞';let s=['','K','M','B','T','Qa','Qi','Sx','Sp','Oc','No','Dc'];let k=0;while(n>=1000&&k<s.length-1){n/=1000;k++}return '$'+(k?n.toFixed(n<10?2:n<100?1:0):Math.floor(n).toLocaleString())+s[k]}
function cost(id,q=1){let b=B[id],o=S.b[id].q,total=0;for(let i=0;i<q;i++)total+=b.c*Math.pow(b.g,o+i);return total}
function maxBuy(id){let n=0;while(cost(id,n+1)<=S.cash&&n<500)n++;return Math.max(1,n)}
function profitMult(id){let q=S.b[id].q,m=1;if(q>=25)m*=2;if(q>=50)m*=2;if(q>=100)m*=2;if(q>=200)m*=2;for(const u of U)if(S.up[u.id]&&(u.target===id&&u.type==='profit'||u.target<0))m*=u.mult;m*=1+S.investors*.02;return m}
function speedMult(id){let q=S.b[id].q,m=1;if(q>=50)m*=2;if(q>=200)m*=2;for(const u of U)if(S.up[u.id]&&u.target===id&&u.type==='speed')m*=u.mult;return m}
function revenue(id){return B[id].r*S.b[id].q*profitMult(id)}
function duration(id){return Math.max(.08,B[id].t/speedMult(id))}
function incomePerSec(){return B.reduce((a,b,i)=>a+(S.b[i].man&&S.b[i].q?revenue(i)/duration(i):0),0)}
function earn(v){S.cash+=v;S.total+=v}
function run(id){let o=S.b[id];if(!o.q||o.run)return;o.run=true;o.p=0}
function buy(id){let q=mult==='max'?maxBuy(id):mult,c=cost(id,q);if(c>S.cash)return toast('Need more capital.');S.cash-=c;S.b[id].q+=q;toast('Bought '+q+' '+B[id].n);render()}
function openManagers(){modalTitle.textContent='Managers';modalBody.innerHTML='';B.forEach((b,i)=>{let o=S.b[i],price=b.m,card=document.createElement('div');card.className='card'+(o.man?' done':'');card.innerHTML='<div><b>👔 '+b.mn+'</b><br><small>Automatically runs '+b.n+'</small></div>';let btn=document.createElement('button');btn.className='btn';btn.textContent=o.man?'Hired':fmt(price);btn.disabled=o.man||S.cash<price;if(!o.man)btn.onclick=()=>{S.cash-=price;o.man=true;run(i);toast('Manager hired.');openManagers();render()};card.appendChild(btn);modalBody.appendChild(card)});modal.classList.add('show')}
function openUpgrades(){modalTitle.textContent='Upgrades';modalBody.innerHTML='';U.forEach(u=>{let done=S.up[u.id],card=document.createElement('div');card.className='card'+(done?' done':'');card.innerHTML='<div><b>⚡ '+u.name+'</b><br><small>'+u.d+'</small></div>';let btn=document.createElement('button');btn.className='btn';btn.textContent=done?'Owned':fmt(u.cost);btn.disabled=done||S.cash<u.cost;if(!done)btn.onclick=()=>{S.cash-=u.cost;S.up[u.id]=1;toast('Upgrade bought.');openUpgrades();render()};card.appendChild(btn);modalBody.appendChild(card)});modal.classList.add('show')}
function openPrestige(){let gain=Math.floor(Math.sqrt(S.total/1000000));modalTitle.textContent='Invest';modalBody.innerHTML='<div class="card"><div><b>💼 Sell the empire?</b><br><small>Reset businesses and cash, but gain investors. Each investor adds +2% profit forever.</small><br><br><b>Potential investors: '+gain+'</b></div><button class="btn" '+(gain<1?'disabled':'')+' id="goPrestige">Cash Out</button></div>';modal.classList.add('show');let g=document.getElementById('goPrestige');if(g)g.onclick=()=>{let keep=S.investors+gain;S=fresh();S.investors=keep;save();modal.classList.remove('show');toast('Empire reborn.');render()}}
function toast(x){toastEl.textContent=x;toastEl.classList.add('show');clearTimeout(toastEl.t);toastEl.t=setTimeout(()=>toastEl.classList.remove('show'),1400)}
function render(){businesses.innerHTML='';let total=0;B.forEach((b,i)=>{let o=S.b[i];total+=o.q;let locked=!o.q&&S.cash<cost(i);let el=document.createElement('section');el.className='biz'+(locked?' locked':'');let pct=o.run?Math.min(100,o.p/duration(i)*100):0;el.innerHTML='<div class="icon '+(o.man?'managed':'')+'">'+b.i+'</div><div class="info"><h3>'+b.n+' <span class="owned">Owned '+o.q+'</span></h3><div class="bar"><div class="fill" style="width:'+pct+'%"></div><span>'+(o.run?'Working… '+Math.floor(pct)+'%':'Click icon to earn '+fmt(revenue(i)))+'</span></div></div>';let ib=el.querySelector('.icon');ib.onclick=()=>{S.clicks++;run(i)};let btn=document.createElement('button');btn.className='btn buy';let q=mult==='max'?maxBuy(i):mult;btn.innerHTML='<small>Buy '+q+'</small><b>'+fmt(cost(i,q))+'</b>';btn.disabled=cost(i,q)>S.cash;btn.onclick=()=>buy(i);el.appendChild(btn);businesses.appendChild(el)});cash.textContent=fmt(S.cash);earned.textContent=fmt(S.total);bizTotal.textContent=total;investors.textContent=S.investors;clicks.textContent=S.clicks;rate.textContent='+'+fmt(incomePerSec()).replace('$','$')+'/sec'}
function tick(now){let dt=(now-last)/1000;last=now;S.b.forEach((o,i)=>{if(o.man&&o.q&&!o.run)run(i);if(o.run){o.p+=dt;if(o.p>=duration(i)){earn(revenue(i));o.p=0;o.run=!!o.man}}});saveTimer+=dt;if(saveTimer>3){saveTimer=0;save()}render();requestAnimationFrame(tick)}
const toastEl=document.getElementById('toast');document.querySelectorAll('[data-mult]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mult]').forEach(x=>x.classList.remove('active'));b.classList.add('active');mult=b.dataset.mult==='max'?'max':+b.dataset.mult;render()});mgrBtn.onclick=openManagers;upgBtn.onclick=openUpgrades;prestigeBtn.onclick=openPrestige;close.onclick=()=>modal.classList.remove('show');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('show')};resetBtn.onclick=()=>{if(confirm('Reset your empire?')){localStorage.removeItem('tycoonEmpire');S=fresh();render()}};
let offline=Math.min(12*3600,Math.max(0,(Date.now()-S.last)/1000));if(offline>30){let gain=incomePerSec()*offline;earn(gain);setTimeout(()=>toast('Offline earnings: '+fmt(gain)),500)}
render();requestAnimationFrame(tick);addEventListener('beforeunload',save);
</script>
</body>
</html>
